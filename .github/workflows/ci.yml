name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request that is pushed to twice does not need two full runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gates first: a formatting mistake should not wait on a VM test.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Check flake metadata
        run: nix flake metadata --json | nix run nixpkgs#jq -- -e '.locks.nodes | length <= 3'

      # Needs network for the Kubernetes JSON schemas, so it cannot be a flake
      # check; the flake check validates the manifests structurally instead.
      - name: Validate the Kubernetes example against upstream schemas
        run: |
          nix run nixpkgs#kubeconform -- \
            -strict -summary -ignore-missing-schemas examples/kubernetes.yaml

      - name: Lint and policy checks
        run: |
          for check in python-lint nix-lint shell-lint workflow-lint dockerfile-lint \
                       version-consistency security-policy corpus-licenses \
                       kubernetes-manifests container-parity; do
            echo "::group::$check"
            nix build --print-build-logs ".#checks.x86_64-linux.$check"
            echo "::endgroup::"
          done

  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve the current system
        id: system
        run: echo "value=$(nix eval --raw --impure --expr 'builtins.currentSystem')" >> "$GITHUB_OUTPUT"

      - name: Build the package and run its tests
        run: nix build --print-build-logs ".#checks.${{ steps.system.outputs.value }}.package"

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve the current system
        id: system
        run: echo "value=$(nix eval --raw --impure --expr 'builtins.currentSystem')" >> "$GITHUB_OUTPUT"

      # Boots llama-server against a 1 MB test model and exercises the probe,
      # the planner, the retrieval proxy and the MCP transport.
      - name: Serve smoke test
        run: nix build --print-build-logs ".#checks.${{ steps.system.outputs.value }}.serve-smoke"

      - name: MCP protocol test
        run: nix build --print-build-logs ".#checks.${{ steps.system.outputs.value }}.mcp-protocol"

  nixos:
    name: NixOS module (VM test)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - name: Module evaluation
        run: nix build --print-build-logs '.#checks.x86_64-linux.nixos-module-eval'

      - name: Full-system VM test
        run: nix build --print-build-logs '.#checks.x86_64-linux.nixos-module'

  corpus:
    name: documentation corpus
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Fetches every pinned documentation source and builds the retrieval
      # index and training dataset. This is the expensive one.
      - name: Build the corpus
        run: nix build --print-build-logs '.#corpus' --out-link corpus-result

      - name: Report corpus statistics
        run: |
          cat corpus-result/rag/stats.txt
          nix run nixpkgs#jq -- . corpus-result/training/stats.json
          {
            echo "### Documentation corpus"
            echo '```'
            cat corpus-result/rag/stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload attribution
        uses: actions/upload-artifact@v4
        with:
          name: corpus-attribution
          path: |
            corpus-result/ATTRIBUTION.md
            corpus-result/training/stats.json

  container:
    name: container image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the image with Nix
        run: |
          nix build --print-build-logs '.#container'
          ./result | docker load

      # The Dockerfile is the other way to build the same thing; building both
      # is how the parity claim stays honest.
      - name: Build the image with the Dockerfile
        run: docker build -f docker/Dockerfile -t nix-llama:dockerfile .

      # The parity claim, checked rather than asserted: the llama-server inside
      # both images must report the same version, build number and commit.
      - name: Compare the llama-server both images carry
        run: |
          nix_build=$(docker run --rm --entrypoint /bin/llama-server \
            "nix-llama:$(cat VERSION)" --version 2>&1 | grep -m1 '^version:')
          dockerfile_build=$(docker run --rm --entrypoint /bin/llama-server \
            nix-llama:dockerfile --version 2>&1 | grep -m1 '^version:')
          echo "nix:        $nix_build"
          echo "dockerfile: $dockerfile_build"
          if [ "$nix_build" != "$dockerfile_build" ]; then
            echo "::error::the two build paths produced different llama-server builds"
            exit 1
          fi

          # Stronger still: the store path itself must match.
          nix_path=$(docker run --rm --entrypoint /bin/sh \
            "nix-llama:$(cat VERSION)" -c 'readlink -f /bin/llama-server')
          dockerfile_path=$(docker run --rm --entrypoint /bin/sh \
            nix-llama:dockerfile -c 'readlink -f /bin/llama-server')
          echo "nix store path:        $nix_path"
          echo "dockerfile store path: $dockerfile_path"
          test "$nix_path" = "$dockerfile_path"

      - name: Smoke-test the image
        run: |
          nix build '.#model-test' --out-link model-test
          docker run --rm --name nix-llama-test -d \
            -p 127.0.0.1:8080:8080 \
            -v "$(readlink -f model-test)":/model:ro \
            -v /nix/store:/nix/store:ro \
            "nix-llama:$(cat VERSION)"
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/health | nix run nixpkgs#jq -- -e '.status == "ok"'
          docker logs nix-llama-test
          docker rm -f nix-llama-test
